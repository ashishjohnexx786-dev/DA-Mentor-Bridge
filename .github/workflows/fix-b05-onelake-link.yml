name: Fix C2B OneLake Source Link
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-b05-onelake-link.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Correct source and resync manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('data-b05.js')
          t=p.read_text()
          bad='https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-securityget-started-security'
          good='https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-security'
          assert t.count(bad)==1, t.count(bad)
          t=t.replace(bad,good)
          p.write_text(t)
          m=json.loads(pathlib.Path('DEPLOY_MANIFEST.json').read_text())
          for f in m.get('files',[]):
              q=pathlib.Path(f['path']); b=q.read_bytes(); f['bytes']=len(b); f['sha256']=hashlib.sha256(b).hexdigest()
          m['sourceLinks']='CURRENT_2026_09_10_VERIFIED'
          m['manifestSync']='EXACT_CURRENT_MAIN'
          pathlib.Path('DEPLOY_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          assert bad not in p.read_text() and good in p.read_text()
          print('PASS corrected C2B OneLake source and manifest')
          PY
          node --check data-b05.js
          git config user.name 'Four-Course Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add data-b05.js DEPLOY_MANIFEST.json
          git commit -m 'Fix C2B OneLake source link'
          git push origin main
