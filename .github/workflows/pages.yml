name: Deploy current Mentor only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean release branch
        uses: actions/checkout@v6
      - name: Verify and extract audited Mentor
        shell: bash
        run: |
          set -euo pipefail
          echo "56094161c7b2f45fa2ac25334793951734e9528d8fe38b3f10fd1c0985c7c209  MENTOR_RELEASE.zip" | sha256sum -c -
          rm -rf _extract _site
          mkdir -p _extract _site
          unzip -q MENTOR_RELEASE.zip -d _extract
          root="$(find _extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"
          cp -a "$root"/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/curriculum.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact current Mentor site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
