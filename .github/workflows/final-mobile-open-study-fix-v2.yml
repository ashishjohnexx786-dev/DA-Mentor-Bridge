name: Repair Bridge Practice Access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-mobile-open-study-fix-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make practice sets obvious and directly clickable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          p=Path('index.html'); s=p.read_text()
          if 'id="homePracticeBtn"' not in s:
              old='<button class="btn" id="openCurrentBtn">Open lesson</button></div><div id="homeLessonSteps"></div>'
              new='<div class="actionRow"><button class="btn" id="openCurrentBtn">Open lesson</button><button class="btn ghost" id="homePracticeBtn">🧪 Open Practice Set</button></div></div><div id="homeLessonSteps"></div>'
              assert old in s, 'current-lesson action anchor missing'
              s=s.replace(old,new,1)
          s=s.replace('id="practiceBtn">🧪 Practice</button>','id="practiceBtn">🧪 Open Practice Set</button>')
          s=s.replace('>Open Practice</button>','>Open Practice Set</button>')
          s=s.replace("openArtifact('Practice',a.practice)","openArtifact('Practice Set',a.practice)")
          anchor="function renderHomeLesson(){const p=curPhase(),l=curLesson(),st=lp(l.id);"
          if "$('#homePracticeBtn').onclick" not in s:
              assert anchor in s, 'renderHomeLesson anchor missing'
              s=s.replace(anchor,anchor+"$('#homePracticeBtn').onclick=()=>openArtifact('Practice Set',p.artifacts?.practice);",1)
          if 'data-open-practice-phase' not in s:
              pat=r'(<button class="btn ghost" data-open-lesson="\$\{esc\(l\.id\)\}" data-open-phase="\$\{esc\(p\.id\)\}">Open</button>)'
              repl=r'\1<button class="btn" data-open-practice-phase="${esc(p.id)}">Practice Set</button>'
              s,n=re.subn(pat,repl,s,count=1)
              assert n==1, 'course lesson-row anchor missing'
              bind="$$('[data-open-lesson]').forEach(b=>b.onclick=()=>setCurrent(b.dataset.openPhase,b.dataset.openLesson));"
              assert bind in s, 'course lesson binding anchor missing'
              s=s.replace(bind,bind+"$$('[data-open-practice-phase]').forEach(b=>b.onclick=()=>openArtifact('Practice Set',phase(b.dataset.openPracticePhase).artifacts?.practice));",1)
          p.write_text(s)

          sw=Path('service-worker.js');t=sw.read_text()
          t=re.sub(r"const CACHE='[^']+';","const CACHE='mentor-de2026-final-2026-09-10-c2b-v6';",t,count=1)
          sw.write_text(t)

          mf=Path('DEPLOY_MANIFEST.json')
          if mf.exists():
              m=json.loads(mf.read_text());m['practiceAccess']='VISIBLE_ON_TODAY_LEARN_AND_COURSE_ROWS';m['runtimeFix']='DE2026_FINAL_RUNTIME_2026_09_10'
              for f in m.get('files',[]):
                  q=Path(f['path'])
                  if q.exists():
                      b=q.read_bytes();f['bytes']=len(b);f['sha256']=hashlib.sha256(b).hexdigest()
              mf.write_text(json.dumps(m,indent=2)+'\n')
          PY

          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('index.html').read_text()
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I)):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              f=Path(f'/tmp/c2b-inline-{i}.js');f.write_text(m.group(2));subprocess.run(['node','--check',str(f)],check=True)
          for x in ['homePracticeBtn','🧪 Open Practice Set','data-open-practice-phase']:
              assert x in h,x
          print('PASS C2B practice controls + inline syntax')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('assets-pack.js','utf8'),c);const A=c.window.MENTOR_ASSETS;if(!A)throw Error('asset pack missing');
          const h=fs.readFileSync('index.html','utf8'),m=h.match(/const C2B_DIRECT_ROUTES=(\{[\s\S]*?\});\s*window\.MENTOR_CONFIG/);if(!m)throw Error('route map not found');
          const R=vm.runInNewContext('('+m[1]+')');for(const [id,r] of Object.entries(R)){if(!r.practice)throw Error('missing practice '+id);const xs=Array.isArray(r.practice)?r.practice:[r.practice];for(const x of xs)if(!A[x])throw Error('practice not packed '+id+' '+x)}
          console.log('PASS all Bridge practice paths are packed and directly openable');
          NODE

          git config user.name 'Four-Course Final QA Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js DEPLOY_MANIFEST.json
          git diff --cached --quiet || git commit -m 'Expose and verify Bridge practice sets'
          git push origin main
